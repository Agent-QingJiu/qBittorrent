name: 发布已通过实机验收的 qBittorrent 5.2.4-0003
on:
  push:
    branches: [release/qbittorrent-5.2.4-0003]
permissions:
  contents: read
jobs:
  release:
    name: 发布已完成实机验收的正式版本
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: 验证构建来源
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: 43718456287
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '
            select(.conclusion == "success" and .head_branch == "main" and
              .path == ".github/workflows/build.yml" and
              (.event == "push" or .event == "workflow_dispatch") and
              .head_repository.full_name == .repository.full_name) | .head_sha')
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bromolow-spk
          path: dist
          run-id: 43718456287
          github-token: ${{ github.token }}
      - name: 校验并发布与实机测试一致的文件
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA256: 30def84a9cdb8f8df9c0437ef18378189a1750593307d4b9dd41bdd871bc48f3
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RUN_ID: 43718456287
        run: bash ci/release
