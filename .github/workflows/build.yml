name: 构建和发布 DSM 6.2.3 SPK

on:
  workflow_dispatch:
    inputs:
      verified_run:
        description: 已完成 DSM 实机验收的构建编号。留空时只构建。
        type: string
      verified_sha256:
        description: 实机验收所用 SPK 的 SHA256
        type: string
  push:
    branches: [main]
    paths:
      - 'ci/**'
      - 'spk/**'
      - 'assets/**'
      - 'sources.lock'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'ci/**'
      - 'spk/**'
      - 'assets/**'
      - 'sources.lock'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: qbittorrent-spk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 源码编译、打包与自动化测试
    if: inputs.verified_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 构建与验证 Bromolow 套件
        run: |
          mkdir -p dist
          bash ci/build 2>&1 | tee dist/build.log
        shell: bash
      - name: 保留构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: dist/*.log
          retention-days: 90
      - name: 上传待实机验收的套件
        uses: actions/upload-artifact@v4
        with:
          name: bromolow-spk
          path: |
            dist/*.spk
            dist/SHA256SUMS
            dist/ELF-dependencies.txt
          if-no-files-found: error
  release:
    name: 发布已完成实机验收的正式版本
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.verified_run != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: 验证构建来源
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.verified_run }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '
            select(.conclusion == "success" and .head_branch == "main" and
              .path == ".github/workflows/build.yml" and
              (.event == "push" or .event == "workflow_dispatch") and
              .head_repository.full_name == .repository.full_name) | .head_sha')
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bromolow-spk
          path: dist
          run-id: ${{ inputs.verified_run }}
          github-token: ${{ github.token }}
      - name: 校验并发布与实机测试一致的文件
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA256: ${{ inputs.verified_sha256 }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RUN_ID: ${{ inputs.verified_run }}
        run: bash ci/release
